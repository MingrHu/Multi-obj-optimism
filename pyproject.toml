[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobo"
version = "1.1.1"
description = "多目标锻造工艺优化工具包：代理模型 + NSGA-II/RL 优化 + DEFORM 自动化 + 几何圆度提取"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Hu Mingrui" }]
license = { text = "Proprietary" }

# 直接依赖（不含纯传递依赖与 GUI）。
# 注意：torch 为 CPU 构建，请用 scripts/setup_env.sh 从 https://download.pytorch.org/whl/cpu 安装；
# 此处仅声明版本下限，避免 pip 从 PyPI 拉取 GPU 版及大量 CUDA 包。
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "joblib",
    "keras",
    "tensorflow",
    "pymoo",
    "gymnasium",
    "stable-baselines3",
    "pyDOE",
    "moocore",
    "torch",
    "Flask>=3.1,<4",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
gui = ["PySide6==6.11.0"]
dev = ["pytest", "pytest-cov", "pytest-mock", "ruff==0.12.12"]

[project.scripts]
mobo-ring-roundness = "mobo.cli.ring_roundness:main"
mobo-ga = "mobo.cli.ga:main"
mobo-rl = "mobo.cli.rl:main"
mobo-surrogate = "mobo.cli.surrogate:main"
mobo-api = "mobo.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: 耗时用例（如 keras/DNN 训练），默认跳过",
    "deform: 依赖 Windows DEFORM 环境的用例",
    "integration: 依赖仓库 data/ 真实产物的集成用例",
]
addopts = "-m 'not slow' --cov=mobo --cov-report=term-missing --import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "logs", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.coverage.run]
source = ["mobo"]
omit = [
    "*/cli/*",
    "*/automation/deform_utils.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
