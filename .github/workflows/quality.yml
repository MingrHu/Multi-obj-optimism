name: Repository quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install CPU dependencies and quality tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/dev.txt
          python -m pip install -e . --no-deps
      - name: Run tests with coverage
        run: |
          mkdir -p quality-reports
          pytest -m "not slow" --cov-report=json:quality-reports/coverage.json
      - name: Enforce complexity baseline
        run: xenon --max-absolute D --max-modules C --max-average B src/mobo
      - name: Generate repository score
        run: python tools/quality_score.py --min-score 60
      - name: Publish job summary
        if: always()
        run: test ! -f quality-reports/quality-score.md || cat quality-reports/quality-score.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-reports
          path: quality-reports/
          retention-days: 30

